# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
   # Configure environment variables.
   # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
   # - variable: MESSAGE
   #   value: Hello world!
   #   availability:
   #     - BUILD
   #     - RUNTIME

   # Grant access to secrets in Cloud Secret Manager.
   # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
   - variable: FIREBASE_SERVICE_ACCOUNT_KEY
     secret: FIREBASE_SERVICE_ACCOUNT_KEY
     availability:
       - BUILD
       - RUNTIME

   - variable: CRON_SECRET
     secret: CRON_SECRET
     availability:
       - RUNTIME

   - variable: GMAIL_USER
     secret: GMAIL_USER
     availability:
       - RUNTIME

   - variable: GMAIL_APP_PASSWORD
     secret: GMAIL_APP_PASSWORD
     availability:
       - RUNTIME

   - variable: CLICKUP_API_TOKEN
     secret: CLICKUP_API_TOKEN
     availability:
       - RUNTIME

   - variable: CLICKUP_WEBHOOK_SECRETS
     secret: CLICKUP_WEBHOOK_SECRETS
     availability:
       - RUNTIME

   - variable: VENNDELO_REFRESH_TOKEN
     secret: VENNDELO_REFRESH_TOKEN
     availability:
       - RUNTIME

   # Cuenta con la que el SERVIDOR se autentica contra Firestore. Sin ella, las server
   # actions y las rutas de API consultan sin sesión y dependen de que la regla
   # isAdminAccess() deje pasar a los no autenticados — el agujero que hay que cerrar.
   # Ver src/lib/firebase-server-auth.ts y scripts/crear-cuenta-servicio.ts
   - variable: FIREBASE_SERVER_EMAIL
     secret: FIREBASE_SERVER_EMAIL
     availability:
       - RUNTIME

   - variable: FIREBASE_SERVER_PASSWORD
     secret: FIREBASE_SERVER_PASSWORD
     availability:
       - RUNTIME
